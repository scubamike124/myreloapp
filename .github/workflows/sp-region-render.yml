name: sp-region-render
# Read-only: opens candidate sites' sign-up and posting pages in headless Chromium and records what their forms ask for
# (field names, phone or date-of-birth fields, CAPTCHA widgets) and the visible rule sentences. Types nothing, submits nothing.
on:
  push:
    branches: [claude/amber-source-promotion-lifecycle-wwlq13]
    paths: ["scan/render-targets/**", "scan/render.mjs", ".github/workflows/sp-region-render.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sp-region-render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install --no-save playwright@1.56.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Render every target file without a result yet
        run: |
          mkdir -p scan/render-results
          for f in scan/render-targets/*.json; do
            b=$(basename "$f" .json)
            if [ -s "scan/render-results/$b.jsonl" ]; then echo "skip $b (has results)"; continue; fi
            echo "== $b"
            node scan/render.mjs "$f" "scan/render-results/$b.jsonl" || echo "render failed for $b"
          done
          rm -f package.json package-lock.json
      - name: Commit the results
        run: |
          git config user.name "sp-region-render"
          git config user.email "sp-region-render@users.noreply.github.com"
          git add scan/render-results/
          git diff --cached --quiet || git commit -m "region render results $(date -u +%FT%TZ)"
          # The branch moves while a run commits (the review is pushed from elsewhere): rebase and push again, up to five times.
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${{ github.ref_name }}" || true
            if git push origin HEAD:"${{ github.ref_name }}"; then exit 0; fi
            sleep $((i * 7))
          done
          exit 1
