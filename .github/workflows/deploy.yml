name: CI

# Runs the test suite on every push to main and on every pull request.
#
# This file used to also deploy: a `deploy` job ran `npm run deploy`
# (wrangler) gated on a CLOUDFLARE_API_TOKEN secret that was never
# configured, so it failed on every single merge to main while shipping
# nothing. Production is deployed by Cloudflare Workers Builds -- the
# dashboard Git integration ("Workers Builds: myreloapp") -- which builds
# and releases every push to main on its own. The dead deploy job is gone;
# the test gate stays, and now runs on PRs too.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
