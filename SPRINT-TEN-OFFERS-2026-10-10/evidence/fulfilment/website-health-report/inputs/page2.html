<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Book now | Willow &amp; Wren Salon</title>
</head>
<body>
  <main>
    <h1>Request an appointment</h1>
    <form id="appointment-request" action="/book/submit" method="post">
      <input type="hidden" name="source" value="website">
      <input type="text" name="full_name" placeholder="Full name" required>
      <label for="email">Email</label>
      <input type="text" id="email" name="email" required>
      <input type="text" name="phone" placeholder="Phone" required>
      <label for="visit-date">Preferred date</label>
      <input type="text" id="visit-date" name="preferred_date" placeholder="MM/DD/YYYY" required>
      <label for="visit-time">Preferred time</label>
      <select id="visit-time" name="preferred_time"><option>Morning</option><option>Afternoon</option></select>
      <label for="svc">Service</label>
      <select id="svc" name="service"><option>Cut</option><option>Colour</option><option>Manicure</option></select>
      <label for="stylist">Stylist</label>
      <input type="text" id="stylist" name="stylist">
      <label for="addr">Street address</label>
      <input type="text" id="addr" name="address">
      <label for="city">City</label>
      <input type="text" id="city" name="city">
      <label for="zip">ZIP</label>
      <input type="text" id="zip" name="zip">
      <label for="how">How did you hear about us?</label>
      <input type="text" id="how" name="referral">
      <textarea name="notes" placeholder="Anything we should know?"></textarea>
      <button type="submit">Submit</button>
    </form>
  </main>
  <footer><a href="/privacy">Privacy notice</a></footer>
</body>
</html>
